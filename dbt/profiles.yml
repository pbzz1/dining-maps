dining_maps:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      # 기본 prefer -- 로컬 docker postgres(TLS 없음)는 평문으로 폴백한다.
      # Actions는 Neon용으로 require를 넣는다 (.github/workflows/rescore.yml).
      sslmode: "{{ env_var('DBT_PG_SSLMODE', 'prefer') }}"
      schema: public
      threads: 4
