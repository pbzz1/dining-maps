# Local Airflow 3.x (LocalExecutor -- no Celery/Redis/worker needed at this
# scale) orchestrating the same scripts/*.py used for manual runs. The whole
# project is mounted into the containers so scripts keep their existing
# relative-path behavior (data/*.csv, db/dining.db) and the SQLite DB stays
# the same file the FastAPI app reads -- Airflow updates it, the app serves
# it, no separate sync step.
#
# Airflow 3.x split the old 2.x "webserver+scheduler" pair into more
# services (api-server replaces webserver, dag-processor is now separate
# from scheduler, and everything talks through a JWT-authenticated
# execution API) -- see docker/README.md for why this looks different from
# a typical 2.x compose file.
#
# Run from the docker/ directory:
#   docker compose up airflow-init   # first time only
#   docker compose up -d
# Then open http://localhost:8080 (user: airflow / pass: airflow)

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
    # DAG가 실행하는 scripts/*.py가 접속할 애플리케이션 DB
    DATABASE_URL: postgresql://dining:dining@postgres-app:5432/dining_maps
    # dbt-postgres는 discrete host/port/user/password/dbname이 필요해 DATABASE_URL을
    # 못 쓴다 -- 위와 같은 값을 따로 주입 (dbt/README.md "접속 정보" 참고).
    DBT_PG_HOST: postgres-app
    DBT_PG_PORT: "5432"
    DBT_PG_USER: dining
    DBT_PG_PASSWORD: dining
    DBT_PG_DBNAME: dining_maps
  volumes:
    - ../dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - ..:/opt/airflow/dining_maps
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    postgres-app:
      condition: service_healthy

services:
  # Airflow 메타데이터 전용. 애플리케이션 데이터와 섞지 않으려고 분리했다.
  # (운영에서는 이 역할을 RDS가 아니라 Airflow 호스팅 쪽이 갖는다)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # 애플리케이션 데이터(메뉴·영양정보·매장). 운영에서는 이 자리를 RDS가 대신하며,
  # 접속 정보는 양쪽 모두 DATABASE_URL 하나로만 주입된다.
  # 호스트에 5432를 열어두어 로컬에서 스크립트/FastAPI를 그대로 돌릴 수 있다.
  postgres-app:
    image: postgres:17
    environment:
      POSTGRES_USER: dining
      POSTGRES_PASSWORD: dining
      POSTGRES_DB: dining_maps
    ports:
      - "5432:5432"
    volumes:
      - postgres-app-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dining"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Air --lastname Flow --role Admin --email airflow@example.com

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  postgres-app-db:
  airflow-logs:
