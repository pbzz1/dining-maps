name: crawl
# 크롤 가능한 브랜드를 Actions에서 주 2회 크롤해 data/*.csv를 자동 커밋한다.
# 커밋만 되면 나머지는 전부 자동: 매일 03시 rescore 워크플로우가 스냅샷 diff ->
# 신메뉴 감지 -> prod 로드 -> 유튜브 연결까지 처리한다.
#
# 여기서 못 도는 브랜드 (로컬 수동 크롤 유지, 이 워크플로우는 해당 CSV를 안 건드림):
#   버거킹   -- WAF가 브라우저 외 요청 차단 (crawl_viable_brands.py 독스트링 참고)
#   맘스터치 -- 영양정보를 이미지로만 공개
#   서브웨이·컴포즈커피 -- Actions(해외 IP)에서 403 (2026-09-02 실측, 로컬에선 정상)
#
# 안전망 2중:
#   1) 파서가 0행을 내면 write_csv가 거부 -> 기존 CSV 보존 (crawl_common.py)
#   2) 깨진 데이터가 커밋돼도 rescore의 스냅샷 품질 게이트가 prod 로드 전에 차단
#
# 알림: 브랜드 하나라도 실패하면 커밋은 정상 진행하되 마지막 단계에서 job을
# 실패시킨다 -> GitHub가 기본 설정대로 실패 메일/앱 알림을 보낸다.
# 브랜드별 행 수는 run 페이지의 Summary 탭에 표로 남는다.
on:
  schedule:
    - cron: '0 17 * * 0,3' # 매주 월·목 02:00 KST (03:00 rescore 전에)
  workflow_dispatch:

permissions:
  contents: write # data/*.csv 자동 커밋

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q beautifulsoup4

      - name: crawl all brands
        run: |
          set -o pipefail  # 없으면 "python | tee"의 종료코드가 tee 것이 돼 실패를 못 잡는다
          : > failed.txt
          for s in mcdonalds lotteria salady; do
            python "scripts/crawl/crawl_$s.py" 2>&1 | tee -a crawl.log || echo "$s" >> failed.txt
          done
          # 멀티 브랜드 드라이버는 브랜드별 실패를 삼키고 FAILED로 출력만 한다 -> 로그에서 수집
          python scripts/crawl/crawl_viable_brands.py 2>&1 | tee -a crawl.log || echo "viable_brands(전체)" >> failed.txt
          # compose는 Actions 해외 IP를 403으로 차단 -> 명시 목록으로 제외 (로컬 수동 크롤)
          python scripts/crawl/crawl_new_brands.py papajohns mrpizza megacoffee sulbing eggdrop paulbassett tlj parisbaguette hsd 2>&1 | tee -a crawl.log || echo "new_brands(전체)" >> failed.txt
          grep -oE "^\[[a-z]+\] FAILED" crawl.log | tr -d '[]' | awk '{print $1}' >> failed.txt || true
          grep -E "^  [a-z]+ +FAILED" crawl.log | awk '{print $1}' >> failed.txt || true
          # 버거킹은 Actions에서 원래 불가 (viable 드라이버에 포함돼 있어 항상 FAILED로 찍힘)
          grep -vE "^(burgerking)$" failed.txt > failed.tmp && mv failed.tmp failed.txt || : > failed.txt

      - name: commit changed CSVs
        run: |
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "변경 없음 -- 커밋 생략"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "크롤 자동 갱신 $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      - name: summary + fail on broken brands
        run: |
          {
            echo "## 크롤 결과 ($(TZ=Asia/Seoul date '+%F %R KST'))"
            echo ""
            echo "| 브랜드 | 행 수 |"
            echo "|---|---|"
            grep -oE "wrote [0-9]+ rows to .*/data/[a-z]+\.csv" crawl.log \
              | sed -E 's#wrote ([0-9]+) rows to .*/data/([a-z]+)\.csv#| \2 | \1 |#'
            grep -oE "^\[[a-z]+\] [0-9]+ rows" crawl.log | sed -E 's#\[([a-z]+)\] ([0-9]+) rows#| \1 | \2 |#'
            grep -E "^  [a-z]+ +[0-9]+ rows" crawl.log | awk '{print "| "$1" | "$2" |"}'
            if [ -s failed.txt ]; then
              echo ""
              echo "### ❌ 실패한 브랜드"
              sed 's/^/- /' failed.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s failed.txt ]; then
            echo "실패 브랜드:" && cat failed.txt
            exit 1  # job을 실패로 -> GitHub 실패 알림 발송 (커밋은 이미 끝난 뒤)
          fi

      # 카톡 '나에게 보내기' 알림. secrets 미설정이면 스크립트가 스스로 건너뛴다.
      # 설정 방법: docs/kakao_notify_setup.md
      - name: kakao notify on failure
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          msg="[Dining Maps] 크롤 실패: $(tr '\n' ' ' < failed.txt 2>/dev/null || echo 워크플로우 오류)"
          python scripts/pipeline/notify_kakao.py "$msg" || echo "::warning::카톡 알림 전송 실패"
