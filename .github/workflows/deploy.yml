name: deploy
# master push 시 변경된 쪽만 배포. 로컬 deploy.sh와 같은 스크립트를 쓴다.
# 필요한 Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, DATABASE_URL, ALLOWED_ORIGINS, VITE_API_BASE, VITE_KAKAO_JS_KEY
# 로그인용(선택, 없으면 로그인 기능만 꺼진 채 배포됨): JWT_SECRET, KAKAO_REST_API_KEY, KAKAO_REDIRECT_URI, KAKAO_CLIENT_SECRET, FRONTEND_URL
on:
  push:
    branches: [master]
  # 매일 rescore가 끝나면 프론트만 다시 배포한다. SEO 정적 페이지는 빌드 시점에 API를
  # 찍어서 굽는데, 크롤 커밋은 data/*.csv만 건드려 아래 paths-filter에 안 걸리고, 그 CSV가
  # 운영 DB에 들어가는 것도 rescore가 돈 뒤다. 그래서 푸시만 기다리면 검색용 페이지가
  # 프론트 코드를 손댈 때까지 계속 옛날 데이터로 남는다(실제로 8일 묵었다).
  workflow_run:
    workflows: [rescore]
    types: [completed]
  workflow_dispatch: # 수동 실행 (둘 다 강제 배포)

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.f.outputs.back }}
      front: ${{ steps.f.outputs.front }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            back: ['app/**', 'scripts/deploy/deploy_lambda.sh']
            front: ['frontend-react/**', 'scripts/deploy/deploy_frontend.sh']

  backend:
    needs: changes
    if: >-
      !cancelled()
      && (needs.changes.outputs.back == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: bash scripts/deploy/deploy_lambda.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      # app_user 등 API가 쓰는 새 테이블은 크롤 잡을 기다리지 않고 배포 때 만든다.
      - run: pip install -q "psycopg[binary]" && python scripts/migrate/apply_schema.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  frontend:
    needs: changes
    # rescore가 실패했으면 DB가 어중간한 상태다 -- 그걸로 SEO 페이지를 굽지 않는다.
    if: >-
      !cancelled()
      && (needs.changes.outputs.front == 'true'
          || github.event_name == 'workflow_dispatch'
          || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend-react/package-lock.json }
      # 배포 게이트: 린트나 E2E가 깨지면 아래 배포 스텝이 실행되지 않는다.
      - run: npm ci && npm run lint
        working-directory: frontend-react
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-react
      - run: npx playwright test
        working-directory: frontend-react
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }} # 지도 스펙이 SDK를 실제로 로드한다
      - run: bash scripts/deploy/deploy_frontend.sh
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }} # 없으면 지도 탭이 빈 화면
