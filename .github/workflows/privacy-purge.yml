name: privacy-purge
# 개인정보 처리방침 2조의 보관 기간을 지킨다 -- 끝난 결제 기록·동의 없는 신체정보 삭제.
# 무엇을 왜 지우는지는 scripts/maintenance/purge_expired.py 머리말.
# 필요한 Secrets: DATABASE_URL
on:
  schedule:
    - cron: '30 18 * * *' # 매일 03:30 KST (rescore 03:00 뒤)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 세기만 하고 지우지 않기
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q "psycopg[binary]"
      - run: python scripts/maintenance/purge_expired.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
